# IPEOT edge proxy — host ports 8280 (HTTP) / 9643 (HTTPS), separate from ADB haproxy 8080/9443.

global
    log stdout format raw local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 10s
    timeout client 15m
    timeout server 15m

frontend ipeot_main
    bind :80
    # HTTPS: add `bind :443 ssl crt /certs/ipeot.pem alpn h2,http/1.1` after creating haproxy/certs/ipeot.pem
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }

    acl is_auth path_beg /api/auth /auth
    acl is_crud path_beg /api/crud /crud
    acl is_upload path_beg /api/files /upload
    acl is_notif path_beg /api/notifications /notification

    use_backend ipeot_auth if is_auth
    use_backend ipeot_crud if is_crud
    use_backend ipeot_upload if is_upload
    use_backend ipeot_notif if is_notif
    default_backend ipeot_web

backend ipeot_web
    server web ipeot-web:80 check

backend ipeot_auth
    server auth ipeot-authservice:9991 check

backend ipeot_crud
    server crud ipeot-crudservice:3034 check

backend ipeot_upload
    server upload ipeot-uploadservice:5051 check

backend ipeot_notif
    server notif ipeot-notifications:8011 check
